[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urop-cross-chemistry-bms"
version = "1.0.0"
description = "Data-Driven Battery State Estimation (SoC/SoH), Cross-Chemistry Generalization, Transfer Learning, and Adaptive Charging Optimization Across Li-Ion and Na-Ion Batteries"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
